# The Xcode project, written as XcodeGen's spec so it is readable and merges cleanly: `xcodegen generate` makes
# Noctorium.xcodeproj from it (CI does, see .github/workflows/ios.yml).
name: Noctorium
options:
  bundleIdPrefix: app.noctorium
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.42.1"
    CURRENT_PROJECT_VERSION: "3500"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Noctorium:
    type: application
    platform: iOS
    sources: [Noctorium]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.noctorium.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Noctorium
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    info:
      path: Noctorium/Info.plist
      properties:
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: app.noctorium.ios
            CFBundleURLSchemes: [noctorium]
  NoctoriumTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NoctoriumTests]
    dependencies:
      - target: Noctorium
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  NoctoriumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NoctoriumUITests]
    dependencies:
      - target: Noctorium
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Noctorium
schemes:
  Noctorium:
    build:
      targets:
        Noctorium: all
    test:
      targets: [NoctoriumTests, NoctoriumUITests]
